# Cluster definition for CI. One node, unlike the three used locally.
#
# Observability is what the extra nodes buy (see ADR-0014), and nothing watches
# scheduling in CI. Dropping to one node saves cluster creation time and — more
# significantly — makes `kind load docker-image` copy a 280 MB image once
# instead of three times.
#
# The honest cost: `podAntiAffinity` in the Deployment is `preferred`, so the
# two replicas simply co-locate rather than failing. CI therefore proves the
# manifests apply and the app serves; it does not prove placement behaves.
#
# Port mappings are kept so the smoke test can reach the Ingress at
# http://localhost, exercising the real ingress.yaml rather than a
# `kubectl port-forward` that would bypass it.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: healthos-ci

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
