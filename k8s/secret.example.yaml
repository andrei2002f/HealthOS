# TEMPLATE ONLY — this file never contains real values and is safe to commit.
#
# Do not `kubectl apply` this. Create the real Secret from the gitignored
# .env.local instead, so no credential is ever written to a file under version
# control:
#
#   kubectl create secret generic healthos-secrets \
#     --namespace healthos \
#     --from-env-file=.env.local \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# ---------------------------------------------------------------------------
# What a Kubernetes Secret actually is
# ---------------------------------------------------------------------------
# base64, not encryption. Anyone who can read the object, or read etcd, reads
# the credential. `stringData` below exists purely so a template is legible;
# the API server base64-encodes it on write and it is no more protected for it.
#
# On a real cluster you would additionally enable encryption at rest for
# secrets, and restrict `get`/`list` on them via RBAC. Neither is done here,
# and neither would make the value secret from a cluster administrator.
#
# ---------------------------------------------------------------------------
# How these values reach a real cluster without touching Git
# ---------------------------------------------------------------------------
# The `--from-env-file` command above is fine for a laptop but does not scale:
# it is manual, unaudited, and invisible to anyone reviewing the deployment.
# The three approaches worth knowing, in rough order of preference:
#
#   1. External Secrets Operator. A `SecretStore` points at the real source of
#      truth — AWS Secrets Manager, Vault, GCP Secret Manager — and an
#      `ExternalSecret` resource, which IS committed, declares which keys to
#      pull. The cluster reconciles the Secret into existence. Git holds a
#      reference, never a value; rotation happens at the source with no deploy.
#
#   2. Sealed Secrets. The value is encrypted with the cluster controller's
#      public key, producing a `SealedSecret` that is safe to commit because
#      only that cluster's controller can decrypt it. GitOps-friendly and
#      self-contained, but rotation means re-sealing, and losing the
#      controller's private key loses every sealed value.
#
#   3. SOPS with age or KMS. Files are encrypted in place, decrypted at apply
#      time. Simple and tool-agnostic; the weak point is key distribution to
#      whoever or whatever runs `apply`.
#
# What all three have in common, and the actual point: the plaintext never
# exists in the repository, and access to it is auditable independently of who
# can read the repo.

apiVersion: v1
kind: Secret
metadata:
  name: healthos-secrets
  namespace: healthos
  labels:
    app.kubernetes.io/name: healthos
type: Opaque
stringData:
  # Supabase
  DATABASE_URL: "postgres://user:password@host:5432/postgres"
  SUPABASE_SERVICE_ROLE_KEY: "replace-me"
  NEXT_PUBLIC_SUPABASE_URL: "https://your-project.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "replace-me"

  # Whoop OAuth
  WHOOP_CLIENT_ID: "replace-me"
  WHOOP_CLIENT_SECRET: "replace-me"

  # Anthropic
  ANTHROPIC_API_KEY: "replace-me"

  # Application
  ALLOWED_EMAIL: "you@example.com"
  ENCRYPTION_KEY: "at-least-32-characters-of-randomness"
  CRON_SECRET: "replace-me"
