# Grafana, provisioned entirely from files.
#
# No clicking. The datasource and the dashboard are ConfigMaps, so what is on
# screen is what is in the repository — a dashboard built by hand in the UI
# lives only in that instance's database and disappears with the cluster.
#
# Anonymous access with the Admin role: this runs on a laptop, reachable only
# through a deliberately-added Ingress path, and a login screen would protect
# nothing while making the thing harder to demonstrate. On any shared cluster
# this is the first line to change.

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: healthos
        type: file
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  # Four panels, each tied to something that has actually gone wrong. The
  # first is the incident this instrumentation exists for.
  healthos.json: |
    {
      "title": "Health OS — background jobs",
      "uid": "healthos-jobs",
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Whoop sync duration (p50 / p90) — 60s is fatal",
          "description": "The real incident: 18s to 49s to 77s, then killed mid-run by the serverless limit. The growth was visible for weeks.",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "fillOpacity": 8, "lineWidth": 2 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 45 },
                  { "color": "red", "value": 60 }
                ]
              }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le) (rate(healthos_whoop_sync_duration_seconds_bucket[30m])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.9, sum by (le) (rate(healthos_whoop_sync_duration_seconds_bucket[30m])))",
              "legendFormat": "p90"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Time since last successful sync",
          "description": "Rises on silence. A cron that stops firing produces no errors at all, so this is the only signal that moves.",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 9 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 90000 },
                  { "color": "red", "value": 172800 }
                ]
              }
            }
          },
          "targets": [
            { "expr": "time() - healthos_whoop_sync_last_success_timestamp_seconds" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Records synced by resource",
          "description": "A resource that quietly drops to zero means an endpoint or a mapper broke, which nothing else surfaces.",
          "gridPos": { "h": 6, "w": 16, "x": 8, "y": 9 },
          "fieldConfig": { "defaults": { "custom": { "fillOpacity": 10 } } },
          "targets": [
            {
              "expr": "sum by (resource) (increase(healthos_whoop_sync_records_total[1h]))",
              "legendFormat": "{{resource}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Heap used vs container limit",
          "description": "Container limit 512Mi, heap capped at 384Mi. Sustained pressure precedes an OOMKill (exit 137).",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "healthos_nodejs_heap_size_used_bytes",
              "legendFormat": "{{pod}} used"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Whoop rate limiting and token refreshes",
          "description": "A failing refresh does not recover on its own: tokens rotate on use, so the integration stays dead until reconnected by hand.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "targets": [
            {
              "expr": "sum(increase(healthos_whoop_rate_limited_total[1h]))",
              "legendFormat": "429s"
            },
            {
              "expr": "sum by (outcome) (increase(healthos_whoop_token_refresh_total[1h]))",
              "legendFormat": "refresh {{outcome}}"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            # Served under a subpath of the same host as the app.
            - name: GF_SERVER_ROOT_URL
              value: "http://localhost/grafana"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Grafana is reachable at http://localhost/grafana. Prometheus deliberately is
# not: its query API can enumerate every series in the cluster, and there is no
# reason to expose it when Grafana proxies the queries it needs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
