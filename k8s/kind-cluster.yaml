# Local cluster definition.
#
#   kind create cluster --config k8s/kind-cluster.yaml
#
# Three nodes rather than one. A single node would run the app perfectly well —
# two replicas on one node still perform a rolling update — but scheduling
# becomes unobservable: you cannot see the scheduler place pods, and nothing
# distinguishes "two replicas" from "one replica twice". The extra ~1.5 GB buys
# a cluster where rollouts and placement behave the way they would in a real
# one. See docs/DECISIONS.md, ADR-0014.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: healthos

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # Labels the node so the ingress-nginx deployment, which carries a
      # matching nodeSelector, is scheduled here — it is the only node with
      # host ports published.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

    # Publishes the ingress controller's ports on the host, so the app is
    # reachable at http://localhost without port-forwarding. Without this a
    # kind cluster is an island: its nodes are containers on a private Docker
    # network with no route in.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  - role: worker
  - role: worker
